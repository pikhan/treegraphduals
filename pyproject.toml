[project]
name = "treegraphduals"
version = "0.1.0"
description = "Trees, their duals, graphs, and time series: level-set trees, Harris paths, Horton-Strahler pruning, and horizontal tunnelability graphs."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ibraheem Mehdi Khan", email = "polymathykhan@gmail.com" }]
keywords = [
    "trees",
    "graphs",
    "level-set trees",
    "harris paths",
    "horton-strahler",
    "time series",
    "duality",
    "random self-similar trees",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "igraph>=0.11",
    "matplotlib>=3.8",
    "networkx>=3.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "sympy>=1.12",
]

[project.urls]
Homepage = "https://github.com/pikhan/treegraphduals"
Repository = "https://github.com/pikhan/treegraphduals"
Documentation = "https://treegraphduals.readthedocs.io"
Changelog = "https://github.com/pikhan/treegraphduals/blob/main/CHANGELOG.md"
Thesis = "http://hdl.handle.net/11714/10548"
Zenodo = "https://doi.org/10.5281/zenodo.22839827"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/treegraphduals"]

# Explicit allow-list: the default (everything not VCS-ignored) would ship local
# working files such as .remember/ and .claude/.
[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "docs",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "CITATION.cff",
    "pyproject.toml",
    "pytest.ini",
    "uv.lock",
]
exclude = ["docs/_build", "docs/__pycache__"]

[tool.uv]
# Keep `uv sync` (used by CI and Read the Docs) installing the docs stack too.
default-groups = ["dev", "docs"]

[dependency-groups]
dev = [
    "hypothesis>=6.168.0",
    "pre-commit>=4.6.2",
    "pyrefly>=1.3.1",
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
    "ruff==0.16.8",
]
docs = [
    "myst-parser>=4.0.1",
    "sphinx>=8.1.3",
    "sphinx-rtd-theme>=3.0.2",
]

[tool.ruff.lint]
extend-select = ["D"]  # pydocstyle, on top of Ruff's default rule set

[tool.ruff.lint.pydocstyle]
convention = "numpy"
