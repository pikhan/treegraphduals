version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    pre_build:
      - pytest --cov=core --cov-report=html --cov-report=term --cov-report=json --doctest-modules -v
      - coverage report --format=markdown > docs/coverage_report.md
      - pytest --tb=no --no-header -q > docs/test_results.txt || true
    post_build:
      - mkdir -p $READTHEDOCS_OUTPUT/html/htmlcov
      - cp -r htmlcov/* $READTHEDOCS_OUTPUT/html/htmlcov/

sphinx:
  configuration: docs/conf.py

python:
  install:
    - method: uv
      command: sync