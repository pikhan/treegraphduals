version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    pre_build:
      # Run the suite once (pytest.ini's addopts add coverage, the HTML report and
      # doctests). pytest exits 1 when tests fail: the build goes on and the
      # Testing page shows the failures, so the docs always reflect main. Exit 2+
      # means the suite didn't run properly (tests failed to load, none were
      # collected, or a pytest error), which also fails CI: abort the build.
      - pytest --tb=no --no-header -q > docs/test_results.txt; status=$?; cat docs/test_results.txt; [ "$status" -le 1 ]
      - coverage report --format=markdown > docs/coverage_report.md
      - coverage json
      # AI provenance statistics (#81, ADR 0006), published by the Stats workflow.
      # Without network or published stats the page says so instead.
      - python scripts/ai_provenance.py render https://raw.githubusercontent.com/pikhan/treegraphduals/stats/ai-stats.json docs/ai_stats.md
    post_build:
      - mkdir -p $READTHEDOCS_OUTPUT/html/htmlcov
      - cp -r htmlcov/* $READTHEDOCS_OUTPUT/html/htmlcov/

sphinx:
  configuration: docs/conf.py

python:
  install:
    - method: uv
      command: sync