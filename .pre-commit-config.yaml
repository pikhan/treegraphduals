repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pyrefly-check
        name: pyrefly check
        entry: uv run pyrefly check
        language: system
        types: [python]
        pass_filenames: false

  - repo: local
    hooks:
      - id: sync-citation
        name: Sync CITATION.cff version/date from pyproject.toml
        entry: uv run python scripts/sync_citation.py
        language: system
        files: ^pyproject\.toml$
        pass_filenames: false