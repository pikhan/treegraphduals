name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0 # no moving v10 tag upstream; pinned exactly
        with:
          python-version: "3.13" # the floor (ADR 0001, decision 7)
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyrefly check

  tests:
    name: test (${{ matrix.python }})${{ matrix.experimental && ' (experimental)' || '' }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.13" # floor
            experimental: false
          - python: "3.14" # newest stable
            experimental: false
          - python: "3.15" # made blocking in #79
            experimental: true
          # No free-threaded (3.14t, 3.15t) jobs: see ADR 0003.
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0 # no moving v10 tag upstream; pinned exactly
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run python -VV
      - run: uv run pytest --cov=treegraphduals --cov-report=term --cov-report=html --cov-report=json --doctest-modules -v
      - name: Upload coverage report
        if: matrix.python == '3.13' # artifact names must be unique per run
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: htmlcov/
      - name: Upload coverage JSON for the badge
        if: matrix.python == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-json
          path: coverage.json

  # The README's coverage badge is a shields.io endpoint badge reading
  # coverage.json from the orphan `badges` branch. Only pushes to main update it.
  coverage-badge:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push to the `badges` branch
    # Queue runs so two quick pushes to main can't race on the `badges` branch.
    concurrency:
      group: coverage-badge
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: coverage-json
          path: ${{ runner.temp }}/coverage
      - run: python3 scripts/coverage_badge.py "$RUNNER_TEMP/coverage/coverage.json" "$RUNNER_TEMP/coverage.json"
      - name: Commit the badge to the badges branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898273+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin badges; then
            git switch -c badges FETCH_HEAD
          else
            git switch --orphan badges
          fi
          cp "$RUNNER_TEMP/coverage.json" coverage.json
          git add coverage.json
          if git diff --cached --quiet; then
            echo "Coverage unchanged; nothing to push."
          else
            git commit -m "Update coverage badge for ${GITHUB_SHA::7}"
            git push origin badges
          fi

  # Branch protection requires a check named exactly `test`. Matrix jobs report
  # as `test (3.13)` and so on, so this job turns the matrix result into `test`.
  test:
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.tests.result }}" = success
