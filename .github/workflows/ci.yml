name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The supported versions live in pyproject.toml (requires-python + classifiers).
  # Reading them here means a SPEC 0 floor bump never has to edit this file.
  versions:
    runs-on: ubuntu-latest
    outputs:
      floor: ${{ steps.read.outputs.floor }}
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Arguments to --ci-matrix are non-blocking extras: 3.15 until #79.
      # No free-threaded (3.14t, 3.15t) jobs: see ADR 0003.
      - id: read
        # Plain assignments, so a script error fails this step (echo "$(...)" wouldn't).
        run: |
          floor="$(python3 scripts/sync_python_versions.py --floor)"
          matrix="$(python3 scripts/sync_python_versions.py --ci-matrix 3.15)"
          echo "floor=$floor" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  lint-and-typecheck:
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ needs.versions.outputs.floor }} # ADR 0001, decision 7
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyrefly check
      - name: Check the supported-Python copies match pyproject.toml
        run: uv run python scripts/sync_python_versions.py --check

  tests:
    name: test (${{ matrix.python }})${{ matrix.experimental && ' (experimental)' || '' }}
    needs: versions
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run python -VV
      - run: uv run pytest --cov=treegraphduals --cov-report=term --cov-report=html --cov-report=json --doctest-modules -v
      - name: Upload coverage report
        if: matrix.python == needs.versions.outputs.floor # artifact names must be unique per run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-html
          path: htmlcov/
      - name: Upload coverage JSON for the badge
        if: matrix.python == needs.versions.outputs.floor
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-json
          path: coverage.json

  # The README's coverage badge is a shields.io endpoint badge reading
  # coverage.json from the orphan `badges` branch. Only pushes to main update it.
  coverage-badge:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push to the `badges` branch
    # Queue runs so two quick pushes to main can't race on the `badges` branch.
    concurrency:
      group: coverage-badge
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # zizmor: ignore[artipacked] `git push` below needs them
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-json
          path: ${{ runner.temp }}/coverage
      - run: python3 scripts/coverage_badge.py "$RUNNER_TEMP/coverage/coverage.json" "$RUNNER_TEMP/coverage.json"
      - name: Commit the badge to the badges branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898273+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin badges; then
            git switch -c badges FETCH_HEAD
          else
            git switch --orphan badges
          fi
          cp "$RUNNER_TEMP/coverage.json" coverage.json
          git add coverage.json
          if git diff --cached --quiet; then
            echo "Coverage unchanged; nothing to push."
          else
            git commit -m "Update coverage badge for ${GITHUB_SHA::7}"
            git push origin badges
          fi

  # The dependency floors in pyproject.toml, on the floor Python. This is what
  # makes the floors tested facts rather than claims (ADR 0001, decision 3).
  # Non-blocking for now: add it to the `test` job's `needs` once it stays green.
  test-lowest-direct:
    name: test (${{ needs.versions.outputs.floor }}, lowest-direct) (experimental)
    needs: versions
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ needs.versions.outputs.floor }}
      # Re-resolves instead of installing uv.lock; the rewritten lockfile stays in the runner.
      - run: uv sync --resolution lowest-direct
      - run: uv pip list
      - run: uv run --no-sync pytest --doctest-modules -v

  # Branch protection requires a check named exactly `test`. Matrix jobs report
  # as `test (3.13)` and so on, so this job turns the matrix result into `test`.
  test:
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.tests.result }}" = success
