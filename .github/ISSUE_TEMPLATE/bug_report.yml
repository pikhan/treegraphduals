name: Bug report
description: Something computes the wrong result, crashes, or behaves differently from its documentation.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. If you suspect a security vulnerability, don't file it here: use the
        [private vulnerability reporting form](https://github.com/pikhan/treegraphduals/security/advisories/new).
        If the problem is that a definition itself looks wrong, use the **Math / definition question** form instead.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A short description of the bug.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Minimal reproducible example
      description: |
        The smallest self-contained code that shows the bug, ideally a few lines that can be pasted
        into a fresh Python session. Include the full traceback if there is one.
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen, and why (for example a worked example or the definition it should follow).
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: treegraphduals version
      description: 'Output of `python -c "import treegraphduals; print(treegraphduals.__version__)"`'
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      description: "Output of `python --version`"
      placeholder: "Python 3.13.1"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Ubuntu 24.04, macOS 15, Windows 11, ..."
    validations:
      required: true
